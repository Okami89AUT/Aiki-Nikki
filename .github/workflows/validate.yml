name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Solange noch keine Lizenz festgelegt ist, wird diese eine Prüfung übersprungen.
          ignore: license

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Abhängigkeiten
        run: pip install aiohttp pyyaml
      - name: Server-Baustein (ohne Home Assistant)
        run: python tests/test_server.py
      - name: Repository (Aufbau, HACS-Regeln, Versionen, Werkzeug)
        run: python tests/test_package.py
